<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Token Vault</title>
    <style>
        /* OBSIDIAN STEALTH THEME */
        :root {
            --bg-main: #1e1e1e;
            --bg-card: #252526;
            --bg-subtle: #2d2d2d;
            --text-main: #d4d4d4;
            --text-muted: #858585;
            --border-color: #3c3c3c;
            --accent-bg: #223b2e;
            --accent-border: #386b4f;
            --accent-text: #68b382;
            --tag-bg: #21323d;
            --tag-border: #3b5a70;
            --tag-text: #569cd6;
            --danger-bg: #382222;
            --danger-border: #6e3333;
            --danger-text: #ff7b7b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px 16px calc(24px + env(safe-area-inset-bottom)) 16px;
        }

        .container {
            width: 100%;
            max-width: 440px; /* Perfect reading & tapping width on Google Pixel & mobile */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .token-val { color: var(--tag-text); }
        .vault-val { color: var(--accent-text); }

        /* Section Styling */
        h2 {
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        /* Checklists */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 48px; /* High-precision tap target */
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .task-item:active {
            background-color: var(--bg-subtle);
        }

        .task-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
        }

        .payout {
            font-family: ui-monospace, monospace;
            color: var(--text-muted);
            font-size: 13px;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 1.5px solid var(--text-muted);
            border-radius: 6px;
            background-color: transparent;
            position: relative;
            cursor: pointer;
        }

        input[type="checkbox"]:checked {
            background-color: var(--tag-text);
            border-color: var(--tag-text);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: var(--bg-main);
            font-size: 15px;
            font-weight: bold;
            top: 0px;
            left: 4px;
        }

        /* Study Stepper Card */
        .study-stepper-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .study-title {
            font-size: 15px;
            font-weight: 500;
        }

        .study-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            min-height: 48px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.15s ease;
        }

        .btn:active {
            transform: scale(0.985);
            filter: brightness(1.2);
        }

        .btn-stepper {
            justify-content: center;
            gap: 6px;
            font-size: 14px;
        }

        .btn-study-add {
            background-color: var(--tag-bg);
            border-color: var(--tag-border);
            color: var(--tag-text);
        }

        .btn-study-sub {
            background-color: var(--bg-subtle);
            border-color: var(--border-color);
            color: var(--text-muted);
        }

        .btn-spend {
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger-text);
            margin-bottom: 8px;
        }

        .btn-vault {
            background-color: var(--accent-bg);
            border-color: var(--accent-border);
            color: var(--accent-text);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP DASHBOARD -->
        <div class="dashboard">
            <div class="stat-card">
                <span class="stat-label">Available Tokens</span>
                <span class="stat-value token-val" id="token-display">0.00</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Wardrobe Vault</span>
                <span class="stat-value vault-val" id="vault-display">$0.00</span>
            </div>
        </div>

        <!-- DAILY NON-NEGOTIABLES (1.25 BASELINE) -->
        <div class="section">
            <h2>Daily Non-Negotiables</h2>
            <ul class="task-list">
                <label class="task-item">
                    <div class="task-label"><input type="checkbox" id="chk-medsDay" onchange="toggleHabit('medsDay', 0.25)"> 💊 Meds (Day)</div>
                    <span class="payout">+0.25</span>
                </label>
                <label class="task-item">
                    <div class="task-label"><input type="checkbox" id="chk-shake" onchange="toggleHabit('shake', 0.50)"> 🥤 Gooba Shake</div>
                    <span class="payout">+0.50</span>
                </label>
                <label class="task-item">
                    <div class="task-label"><input type="checkbox" id="chk-reset" onchange="toggleHabit('reset', 0.25)"> 🧹 3-Min Reset</div>
                    <span class="payout">+0.25</span>
                </label>
                <label class="task-item">
                    <div class="task-label"><input type="checkbox" id="chk-medsNight" onchange="toggleHabit('medsNight', 0.25)"> 💊 Meds (Night)</div>
                    <span class="payout">+0.25</span>
                </label>
            </ul>
        </div>

        <!-- FLEXIBLE ENGINE -->
        <div class="section">
            <h2>Flexible Engine</h2>
            <ul class="task-list">
                <label class="task-item">
                    <div class="task-label"><input type="checkbox" id="chk-gym" onchange="toggleHabit('gym', 1.00)"> 🏋️ Gym / Lift</div>
                    <span class="payout">+1.00</span>
                </label>
            </ul>

            <!-- STUDY BLOCK STEPPER (ADD / UNDO) -->
            <div class="study-stepper-card">
                <div class="study-header">
                    <span class="study-title">💻 Study Hours: <strong id="study-count" style="color: var(--tag-text);">0</strong> hrs</span>
                    <span class="payout" id="study-payout">+0.00 🪙</span>
                </div>
                <div class="study-controls">
                    <button class="btn btn-stepper btn-study-sub" onclick="adjustStudy(-1)">
                        <span>➖ Undo 1h</span>
                    </button>
                    <button class="btn btn-stepper btn-study-add" onclick="adjustStudy(1)">
                        <span>➕ Log 1h (+1.50)</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- SPEND MENU -->
        <div class="section">
            <h2>Spend & Redeem</h2>
            <button class="btn btn-spend" onclick="spendDowntime()">
                <span>🛋️ 1 hr Downtime</span>
                <span class="payout" style="color: inherit;">-1.00 🪙</span>
            </button>
            <button class="btn btn-vault" onclick="bankToVault()">
                <span>💵 Bank to Vault</span>
                <span class="payout" style="color: inherit;">-1.00 ➔ $2.50</span>
            </button>
        </div>
    </div>

    <script>
        // Data Structure & Storage
        let state = JSON.parse(localStorage.getItem('tokenApp')) || {
            tokens: 0.00,
            vaultCash: 0.00,
            lastDate: new Date().toLocaleDateString(),
            studyBlocks: 0,
            habits: { medsDay: false, shake: false, reset: false, medsNight: false, gym: false }
        };

        // Midnight Reset Logic (Checks local date)
        const today = new Date().toLocaleDateString();
        if (state.lastDate !== today) {
            state.habits = { medsDay: false, shake: false, reset: false, medsNight: false, gym: false };
            state.studyBlocks = 0; // Resets daily study session counter for the new day
            state.lastDate = today;
            saveState();
        }

        // Render UI
        function updateUI() {
            document.getElementById('token-display').innerText = Math.max(0, state.tokens).toFixed(2);
            document.getElementById('vault-display').innerText = "$" + state.vaultCash.toFixed(2);
            
            // Checkboxes
            document.getElementById('chk-medsDay').checked = state.habits.medsDay || false;
            document.getElementById('chk-shake').checked = state.habits.shake || false;
            document.getElementById('chk-reset').checked = state.habits.reset || false;
            document.getElementById('chk-medsNight').checked = state.habits.medsNight || false;
            document.getElementById('chk-gym').checked = state.habits.gym || false;

            // Study Counter
            const studyHours = state.studyBlocks || 0;
            document.getElementById('study-count').innerText = studyHours;
            document.getElementById('study-payout').innerText = "+" + (studyHours * 1.50).toFixed(2) + " 🪙";
        }

        function saveState() {
            localStorage.setItem('tokenApp', JSON.stringify(state));
            updateUI();
        }

        // Habit Toggle Logic
        function toggleHabit(habitKey, value) {
            const isChecked = document.getElementById(`chk-${habitKey}`).checked;
            state.habits[habitKey] = isChecked;
            
            if (isChecked) {
                state.tokens += value;
            } else {
                state.tokens = Math.max(0, state.tokens - value);
            }
            saveState();
        }

        // Study Stepper with Undo
        function adjustStudy(delta) {
            if (delta > 0) {
                state.studyBlocks = (state.studyBlocks || 0) + 1;
                state.tokens += 1.50;
                saveState();
            } else if (delta < 0) {
                if ((state.studyBlocks || 0) > 0) {
                    state.studyBlocks -= 1;
                    state.tokens = Math.max(0, state.tokens - 1.50);
                    saveState();
                } else {
                    alert("No study hours logged today to undo.");
                }
            }
        }

        // Spend Actions
        function spendDowntime() {
            if (state.tokens >= 1.00) {
                state.tokens -= 1.00;
                saveState();
            } else {
                alert("Not enough tokens! Complete daily habits or study first.");
            }
        }

        function bankToVault() {
            if (state.tokens >= 1.00) {
                state.tokens -= 1.00;
                state.vaultCash += 2.50;
                saveState();
            } else {
                alert("Not enough tokens to convert to vault cash!");
            }
        }

        // Initial Load
        updateUI();
    </script>
</body>
</html>
