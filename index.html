<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#eef0f2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gooba Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Gooba Tracker</title>
    
    <!-- INLINE PIXEL CAT ICON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='white'/><rect x='3' y='4' width='2' height='2' fill='black'/><rect x='11' y='4' width='2' height='2' fill='black'/><rect x='5' y='5' width='6' height='1' fill='black'/><rect x='2' y='6' width='1' height='5' fill='black'/><rect x='13' y='6' width='1' height='5' fill='black'/><rect x='3' y='11' width='10' height='1' fill='black'/><rect x='4' y='7' width='2' height='2' fill='black'/><rect x='10' y='7' width='2' height='2' fill='black'/><rect x='7' y='9' width='2' height='1' fill='black'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='white'/><rect x='3' y='4' width='2' height='2' fill='black'/><rect x='11' y='4' width='2' height='2' fill='black'/><rect x='5' y='5' width='6' height='1' fill='black'/><rect x='2' y='6' width='1' height='5' fill='black'/><rect x='13' y='6' width='1' height='5' fill='black'/><rect x='3' y='11' width='10' height='1' fill='black'/><rect x='4' y='7' width='2' height='2' fill='black'/><rect x='10' y='7' width='2' height='2' fill='black'/><rect x='7' y='9' width='2' height='1' fill='black'/></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #eef0f2;
            --bg-card: #1c1c1e;
            --bg-icon: #ffffff;
            --bg-check-off: #3a3a3c;
            --bg-check-on: #c5f0a4;
            --text-dark: #1c1c1e;
            --text-light: #ffffff;
            --text-muted: #8e8e93;
            --accent-blue: #90d4f7;
            --accent-red: #ff8a8a;
            --radius-card: 24px;
            --radius-btn: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'VT323', monospace;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            text-transform: uppercase;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px calc(40px + env(safe-area-inset-bottom)) 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: left; margin-bottom: 4px; }
        .header h1 { font-size: 42px; line-height: 0.9; color: var(--text-dark); letter-spacing: 1px; }
        .header p { font-size: 22px; color: #666; margin-top: 4px; }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 20px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background-color: #2c2c2e; border-radius: var(--radius-btn); padding: 16px; display: flex; flex-direction: column; justify-content: center; }
        .streak-box { grid-column: span 2; flex-direction: row; justify-content: space-between; align-items: center; }
        .stat-label { font-size: 18px; color: var(--text-muted); letter-spacing: 0.5px; }
        .stat-value { font-size: 36px; margin-top: 4px; }
        
        .val-token { color: var(--accent-blue); }
        .val-vault { color: var(--bg-check-on); }
        .val-streak { color: #ffd60a; font-size: 28px; }

        .task-list { display: flex; flex-direction: column; gap: 16px; }
        .task-item { display: flex; align-items: center; cursor: pointer; }
        .task-icon { width: 44px; height: 44px; background-color: var(--bg-icon); color: var(--text-dark); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .task-details { flex-grow: 1; margin-left: 14px; display: flex; flex-direction: column; }
        .task-title { font-size: 24px; letter-spacing: 0.5px; line-height:1.1; }
        .task-subtitle { font-size: 18px; color: var(--text-muted); margin-top: 2px; }

        .task-check { width: 44px; height: 44px; background-color: var(--bg-check-off); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--text-dark); flex-shrink: 0; transition: background-color 0.1s; }
        .task-check.checked { background-color: var(--bg-check-on); }

        .study-controls { display: flex; align-items: center; justify-content: space-between; background-color: #2c2c2e; border-radius: var(--radius-btn); padding: 8px; }
        .study-btn { width: 44px; height: 44px; background-color: var(--bg-icon); color: var(--text-dark); border: none; border-radius: 10px; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .study-btn:active { background-color: #d1d1d6; }
        .study-display { font-size: 26px; text-align: center; flex-grow: 1; }

        .btn { background-color: #2c2c2e; color: var(--text-light); border: none; padding: 16px; border-radius: var(--radius-btn); font-size: 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; width: 100%; }
        .btn:active { background-color: #3a3a3c; }
        
        .btn-half { width: calc(50% - 6px); display: inline-flex; justify-content: center; }
        .btn-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .btn-green { background-color: var(--bg-check-on); color: var(--text-dark); }
        .btn-green:active { background-color: #aadb85; }

        .settings-row { display: flex; justify-content: space-between; padding: 0 10px; }
        .data-text { font-size: 20px; color: #888; cursor: pointer; padding: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; animation: fadeIn 0.15s ease-out; }
        .modal-box { background-color: var(--bg-card); border-radius: var(--radius-card); padding: 24px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); color: var(--text-light); animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid rgba(255,255,255,0.08); }
        .modal-msg { font-size: 24px; text-align: center; line-height: 1.2; }
        .modal-input { width: 100%; padding: 12px; border-radius: 10px; background: #2c2c2e; border: 2px solid #3a3a3c; color: #fff; font-size: 24px; text-align: center; outline: none; font-family: 'VT323', monospace; }
        .modal-input:focus { border-color: var(--accent-blue); }
        .modal-list-item { display: flex; justify-content: space-between; align-items: center; background: #2c2c2e; padding: 10px 12px; border-radius: 10px; font-size: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>GOOBA TRACKER</h1>
            <p id="current-date">DATE LOADING...</p>
        </div>

        <!-- DASHBOARD CARD -->
        <div class="card">
            <div class="dashboard-grid">
                <div class="stat-box streak-box">
                    <span class="stat-label">BASELINE STREAK</span>
                    <span class="stat-value val-streak"><span id="streak-display">0</span> DAYS</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">TOKENS</span>
                    <span class="stat-value val-token" id="token-display">0.00</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">VAULT</span>
                    <span class="stat-value val-vault" id="vault-display">$0.00</span>
                </div>
            </div>
        </div>

        <!-- DYNAMIC BASELINE CARD -->
        <div class="card">
            <div class="stat-label" id="routine-title" style="margin-bottom: 4px;">DAILY ROUTINE</div>
            <div class="task-list" id="routine-container"></div>
            <button class="btn" style="background:transparent; color:var(--accent-blue); font-size:18px; padding:8px; justify-content:center; margin-top:4px;" onclick="openEditRoutine()">⚙️ EDIT ROUTINE</button>
        </div>

        <!-- FLEXIBLE ENGINE CARD -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 4px;">FLEXIBLE ENGINE</div>
            <div class="task-list">
                <div class="task-item" onclick="promptGym()">
                    <div class="task-icon">GY</div>
                    <div class="task-details">
                        <div class="task-title">LIFT SESSION</div>
                        <div class="task-subtitle">+1.00 TOKENS (LOCKED ONCE CHECKED)</div>
                    </div>
                    <div class="task-check" id="chk-gym"></div>
                </div>
            </div>

            <div style="margin-top: 8px;">
                <div class="task-details" style="margin-left: 0; margin-bottom: 12px;">
                    <div class="task-title">STUDY LOG</div>
                    <div class="task-subtitle" id="study-payout">+0.00 TOKENS</div>
                </div>
                <div class="study-controls">
                    <button class="study-btn" onclick="adjustStudy(-1)">-</button>
                    <div class="study-display"><span id="study-count">0</span> HRS</div>
                    <button class="study-btn" onclick="adjustStudy(1)">+</button>
                </div>
            </div>
        </div>

        <!-- SPEND CARD -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 4px;">SPEND & REDEEM</div>
            
            <div class="btn-row">
                <button class="btn btn-half" style="color: var(--accent-red);" onclick="spendTokens(0.50, '30M DOWNTIME')">30M (-0.50)</button>
                <button class="btn btn-half" style="color: var(--accent-red);" onclick="spendTokens(1.00, '1H DOWNTIME')">1HR (-1.00)</button>
            </div>
            
            <div class="btn-row">
                <button class="btn btn-half" style="color: var(--text-muted);" onclick="undoBankVault()">➖ UNDO BANK</button>
                <button class="btn btn-half btn-green" onclick="bankToVault()">BANK (-1.00)</button>
            </div>
            
            <button class="btn" style="justify-content: center; margin-bottom: 0;" onclick="spendVaultCash()">
                🛒 SPEND VAULT CASH
            </button>
        </div>

        <!-- SETTINGS -->
        <div class="settings-row">
            <div class="data-text" onclick="exportData()">EXPORT SAVE</div>
            <div class="data-text" onclick="document.getElementById('import-file').click()">IMPORT SAVE</div>
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <!-- CUSTOM OVERLAY POP-UPS -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        
        <!-- GENERIC ALERT -->
        <div id="alert-box" class="modal-box" style="display: none;">
            <div id="alert-msg" class="modal-msg"></div>
            <button class="btn btn-green" style="justify-content: center;" onclick="closeModal()">OK</button>
        </div>
        
        <!-- CONFIRMATION POP-UP -->
        <div id="confirm-box" class="modal-box" style="display: none;">
            <div id="confirm-msg" class="modal-msg"></div>
            <div class="btn-row" style="margin-bottom: 0;">
                <button class="btn btn-half" style="justify-content: center;" onclick="closeConfirm(false)">CANCEL</button>
                <button class="btn btn-half btn-green" style="justify-content: center;" onclick="closeConfirm(true)">LOCK IN</button>
            </div>
        </div>

        <!-- NUMBER PROMPT -->
        <div id="prompt-box" class="modal-box" style="display: none;">
            <div id="prompt-msg" class="modal-msg"></div>
            <input type="number" id="prompt-input" class="modal-input" placeholder="0.00" step="0.01">
            <div class="btn-row" style="margin-bottom: 0;">
                <button class="btn btn-half" style="justify-content: center;" onclick="closePrompt(false)">CANCEL</button>
                <button class="btn btn-half btn-green" style="justify-content: center;" onclick="closePrompt(true)">CONFIRM</button>
            </div>
        </div>

        <!-- EDIT & REORDER ROUTINE MENU -->
        <div id="edit-routine-box" class="modal-box" style="display: none;">
            <div class="modal-msg" style="margin-bottom:0;">EDIT & REORDER</div>
            <div id="edit-list-container" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>
            
            <div style="border-top: 1px solid #3a3a3c; padding-top: 16px; display:flex; gap:6px;">
                <input type="text" id="new-h-icon" class="modal-input" placeholder="IC" maxlength="2" style="width: 22%; padding:10px 2px;">
                <input type="text" id="new-h-name" class="modal-input" placeholder="HABIT NAME" style="flex-grow:1; padding:10px 6px;">
                <input type="number" id="new-h-pay" class="modal-input" placeholder="+0.25" step="0.05" style="width: 28%; padding:10px 2px;">
            </div>
            
            <div class="btn-row" style="margin-bottom: 0;">
                <button class="btn btn-half" style="justify-content: center;" onclick="closeModal()">DONE</button>
                <button class="btn btn-half btn-green" style="justify-content: center;" onclick="addHabit()">ADD</button>
            </div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        
        function playDing() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playBloop() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function triggerHaptic() { if (navigator.vibrate) navigator.vibrate(40); }

        const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', dateOptions);

        const DEFAULT_STATE = {
            version: 1.4,
            tokens: 0.00,
            vaultCash: 0.00,
            streak: 0,
            baselineMet: false,
            lastDate: new Date().toLocaleDateString(),
            studyBlocks: 0,
            habits: { gym: false },
            dailyRoutine: [
                { id: 'h1', icon: 'MD', name: 'MEDS (DAY)', payout: 0.25, checked: false },
                { id: 'h2', icon: 'SH', name: 'GOOBA SHAKE', payout: 0.50, checked: false },
                { id: 'h3', icon: 'RE', name: '3-MIN RESET', payout: 0.25, checked: false },
                { id: 'h4', icon: 'MN', name: 'MEDS (NIGHT)', payout: 0.25, checked: false }
            ]
        };

        let loadedState = JSON.parse(localStorage.getItem('tokenApp'));
        let state = { ...DEFAULT_STATE };
        if (loadedState) {
            state = { ...DEFAULT_STATE, ...loadedState };
            if (loadedState.habits && !loadedState.dailyRoutine) {
                state.dailyRoutine = [];
                if (loadedState.habits.medsDay !== undefined) state.dailyRoutine.push({ id: 'h1', icon: 'MD', name: 'MEDS (DAY)', payout: 0.25, checked: loadedState.habits.medsDay });
                if (loadedState.habits.shake !== undefined) state.dailyRoutine.push({ id: 'h2', icon: 'SH', name: 'GOOBA SHAKE', payout: 0.50, checked: loadedState.habits.shake });
                if (loadedState.habits.reset !== undefined) state.dailyRoutine.push({ id: 'h3', icon: 'RE', name: '3-MIN RESET', payout: 0.25, checked: loadedState.habits.reset });
                if (loadedState.habits.medsNight !== undefined) state.dailyRoutine.push({ id: 'h4', icon: 'MN', name: 'MEDS (NIGHT)', payout: 0.25, checked: loadedState.habits.medsNight });
            }
            state.habits = { gym: loadedState.habits?.gym || false };
        }

        const today = new Date().toLocaleDateString();
        if (state.lastDate !== today) {
            let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            if (state.lastDate === yesterday.toLocaleDateString() && state.baselineMet) { state.streak += 1; } 
            else { state.streak = 0; }
            state.dailyRoutine.forEach(h => h.checked = false);
            state.habits.gym = false;
            state.studyBlocks = 0;
            state.baselineMet = false;
            state.lastDate = today;
            saveState();
        }

        let promptCallback = null;
        let confirmCallback = null;

        function hideAllModals() {
            document.getElementById('alert-box').style.display = 'none';
            document.getElementById('confirm-box').style.display = 'none';
            document.getElementById('prompt-box').style.display = 'none';
            document.getElementById('edit-routine-box').style.display = 'none';
        }

        function closeModal() {
            triggerHaptic();
            document.getElementById('modal-overlay').style.display = 'none';
            hideAllModals();
        }

        function customAlert(msg) {
            triggerHaptic(); playBloop();
            hideAllModals();
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('alert-box').style.display = 'flex';
        }

        function customConfirm(msg, callback) {
            triggerHaptic(); confirmCallback = callback; hideAllModals();
            document.getElementById('confirm-msg').innerText = msg;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('confirm-box').style.display = 'flex';
        }

        function closeConfirm(isConfirm) {
            closeModal();
            if (isConfirm && confirmCallback) confirmCallback();
            confirmCallback = null;
        }

        function customPrompt(msg, callback) {
            triggerHaptic(); promptCallback = callback; hideAllModals();
            document.getElementById('prompt-msg').innerText = msg;
            document.getElementById('prompt-input').value = '';
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('prompt-box').style.display = 'flex';
            document.getElementById('prompt-input').focus();
        }

        function closePrompt(isConfirm) {
            closeModal();
            if (isConfirm && promptCallback) promptCallback(document.getElementById('prompt-input').value);
            promptCallback = null;
        }

        function openEditRoutine() {
            triggerHaptic(); hideAllModals();
            renderEditList();
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('edit-routine-box').style.display = 'flex';
        }

        function renderEditList() {
            const container = document.getElementById('edit-list-container');
            container.innerHTML = '';
            state.dailyRoutine.forEach((habit, index) => {
                let upBtn = index > 0 ? `<button style="background:none; border:none; color:var(--text-light); font-size:18px; cursor:pointer;" onclick="moveHabit(${index}, -1)">⬆️</button>` : `<span style="opacity:0.2;">⬆️</span>`;
                let downBtn = index < state.dailyRoutine.length - 1 ? `<button style="background:none; border:none; color:var(--text-light); font-size:18px; cursor:pointer;" onclick="moveHabit(${index}, 1)">⬇️</button>` : `<span style="opacity:0.2;">⬇️</span>`;
                let deleteBtn = habit.checked 
                    ? `<span style="font-size:13px; color:var(--text-muted);">LOCKED</span>` 
                    : `<button style="background:none; border:none; color:var(--accent-red); font-size:20px; cursor:pointer;" onclick="deleteHabit(${index})">❌</button>`;
                
                container.innerHTML += `
                    <div class="modal-list-item">
                        <div style="display:flex; align-items:center; gap:6px;">
                            ${upBtn} ${downBtn}
                            <span>[${habit.icon}]</span>
                        </div>
                        <span style="flex-grow:1; margin-left:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${habit.name}</span>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="color:var(--accent-blue);">+${habit.payout.toFixed(2)}</span>
                            ${deleteBtn}
                        </div>
                    </div>`;
            });
        }

        function moveHabit(index, direction) {
            triggerHaptic();
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= state.dailyRoutine.length) return;
            
            const item = state.dailyRoutine.splice(index, 1)[0];
            state.dailyRoutine.splice(targetIndex, 0, item);
            saveState();
            renderEditList();
        }

        function addHabit() {
            triggerHaptic();
            const icon = document.getElementById('new-h-icon').value.trim() || 'XX';
            const name = document.getElementById('new-h-name').value.trim() || 'NEW HABIT';
            const payout = parseFloat(document.getElementById('new-h-pay').value) || 0;
            
            state.dailyRoutine.push({ id: 'h' + Date.now(), icon: icon.substring(0,2), name: name, payout: payout, checked: false });
            
            document.getElementById('new-h-icon').value = '';
            document.getElementById('new-h-name').value = '';
            document.getElementById('new-h-pay').value = '';
            
            evaluateBaseline(); saveState(); renderEditList();
        }

        function deleteHabit(index) {
            triggerHaptic();
            const habit = state.dailyRoutine[index];
            if (habit.checked) {
                customAlert("CANNOT DELETE A COMPLETED HABIT TODAY!");
                return;
            }
            state.dailyRoutine.splice(index, 1);
            evaluateBaseline(); saveState(); renderEditList();
        }

        function updateUI() {
            document.getElementById('token-display').innerText = Math.max(0, state.tokens).toFixed(2);
            document.getElementById('vault-display').innerText = "$" + state.vaultCash.toFixed(2);
            document.getElementById('streak-display').innerText = state.streak;
            
            const routineContainer = document.getElementById('routine-container');
            routineContainer.innerHTML = '';
            let totalRoutinePayout = 0;
            
            state.dailyRoutine.forEach((habit, i) => {
                totalRoutinePayout += habit.payout;
                const checkClass = habit.checked ? 'task-check checked' : 'task-check';
                const checkText = habit.checked ? '✓' : '';
                routineContainer.innerHTML += `
                    <div class="task-item" onclick="promptRoutineHabit(${i})">
                        <div class="task-icon">${habit.icon}</div>
                        <div class="task-details">
                            <div class="task-title">${habit.name}</div>
                            <div class="task-subtitle">+${habit.payout.toFixed(2)} TOKENS ${habit.checked ? '(LOCKED)' : ''}</div>
                        </div>
                        <div class="${checkClass}">${checkText}</div>
                    </div>
                `;
            });
            
            document.getElementById('routine-title').innerText = `DAILY ROUTINE (${totalRoutinePayout.toFixed(2)})`;

            const elGym = document.getElementById('chk-gym');
            if (state.habits.gym) { elGym.classList.add('checked'); elGym.innerText = '✓'; } 
            else { elGym.classList.remove('checked'); elGym.innerText = ''; }

            const studyHours = state.studyBlocks || 0;
            document.getElementById('study-count').innerText = studyHours;
            document.getElementById('study-payout').innerText = "+" + (studyHours * 1.50).toFixed(2) + " TOKENS";
        }

        function saveState() { localStorage.setItem('tokenApp', JSON.stringify(state)); updateUI(); }

        function evaluateBaseline() {
            if (state.dailyRoutine.length === 0) {
                state.baselineMet = false;
            } else {
                state.baselineMet = state.dailyRoutine.every(h => h.checked);
            }
        }

        function promptRoutineHabit(index) {
            triggerHaptic();
            const habit = state.dailyRoutine[index];
            
            if (habit.checked) {
                playBloop();
                customAlert("HABIT ALREADY COMPLETED! CANNOT UNCHECK ONCE LOCKED.");
                return;
            }
            
            customConfirm(`LOCK IN [${habit.name}] FOR +${habit.payout.toFixed(2)} TOKENS?`, function() {
                habit.checked = true;
                playDing();
                state.tokens += habit.payout;
                evaluateBaseline(); 
                saveState();
            });
        }

        function promptGym() {
            triggerHaptic();
            if (state.habits.gym) {
                playBloop();
                customAlert("LIFT SESSION ALREADY LOCKED FOR TODAY!");
                return;
            }
            
            customConfirm(`LOCK IN [LIFT SESSION] FOR +1.00 TOKENS?`, function() {
                state.habits.gym = true;
                playDing();
                state.tokens += 1.00;
                saveState();
            });
        }

        function adjustStudy(delta) {
            triggerHaptic();
            if (delta > 0) {
                playDing(); state.studyBlocks++; state.tokens += 1.50;
            } else if (delta < 0 && state.studyBlocks > 0) {
                if (state.tokens >= 1.50) {
                    playBloop(); state.studyBlocks--; state.tokens -= 1.50;
                } else {
                    playBloop();
                    customAlert("CANNOT UNDO STUDY: TOKENS ALREADY SPENT!");
                    return;
                }
            }
            saveState();
        }

        function spendTokens(cost, name) {
            triggerHaptic();
            if (state.tokens >= cost) { playBloop(); state.tokens -= cost; saveState(); } 
            else { customAlert(`NOT ENOUGH TOKENS FOR ${name}!`); }
        }

        function bankToVault() {
            triggerHaptic();
            if (state.tokens >= 1.00) {
                playDing(); state.tokens -= 1.00; state.vaultCash += 2.50; saveState();
            } else { customAlert("NOT ENOUGH TOKENS TO BANK!"); }
        }

        function undoBankVault() {
            triggerHaptic();
            if (state.vaultCash >= 2.50) {
                playBloop();
                state.vaultCash -= 2.50;
                state.tokens += 1.00;
                saveState();
            } else {
                customAlert("NOT ENOUGH CASH IN VAULT TO UNDO!");
            }
        }

        function spendVaultCash() {
            triggerHaptic();
            if (state.vaultCash <= 0) { customAlert("VAULT IS EMPTY!"); return; }
            customPrompt(`HOW MUCH DID YOU SPEND?\n(MAX: $${state.vaultCash.toFixed(2)})`, function(amountStr) {
                if (!amountStr) return;
                let amount = parseFloat(amountStr);
                if (isNaN(amount) || amount <= 0) { customAlert("INVALID AMOUNT."); return; }
                if (amount > state.vaultCash) { customAlert("NOT ENOUGH VAULT CASH!"); return; }
                playBloop(); state.vaultCash -= amount; saveState();
            });
        }

        function exportData() {
            triggerHaptic(); playDing();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dlNode = document.createElement('a'); dlNode.setAttribute("href", dataStr);
            dlNode.setAttribute("download", `gooba_tracker_backup_${today.replace(/\//g, '-')}.json`);
            document.body.appendChild(dlNode); dlNode.click(); dlNode.remove();
        }

        function importData(event) {
            triggerHaptic(); const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.tokens !== undefined) {
                        state = { ...DEFAULT_STATE, ...imported };
                        if (imported.habits && !imported.dailyRoutine) {
                            state.dailyRoutine = [];
                            if (imported.habits.medsDay !== undefined) state.dailyRoutine.push({ id: 'h1', icon: 'MD', name: 'MEDS (DAY)', payout: 0.25, checked: imported.habits.medsDay });
                            if (imported.habits.shake !== undefined) state.dailyRoutine.push({ id: 'h2', icon: 'SH', name: 'GOOBA SHAKE', payout: 0.50, checked: imported.habits.shake });
                            if (imported.habits.reset !== undefined) state.dailyRoutine.push({ id: 'h3', icon: 'RE', name: '3-MIN RESET', payout: 0.25, checked: imported.habits.reset });
                            if (imported.habits.medsNight !== undefined) state.dailyRoutine.push({ id: 'h4', icon: 'MN', name: 'MEDS (NIGHT)', payout: 0.25, checked: imported.habits.medsNight });
                        }
                        state.habits = { gym: imported.habits?.gym || false };
                        evaluateBaseline(); saveState(); playDing(); customAlert("DATA RESTORED SUCCESSFULLY!");
                    } else { customAlert("INVALID BACKUP FILE."); }
                } catch (err) { customAlert("ERROR READING FILE."); }
            };
            reader.readAsText(file);
        }

        updateUI();
    </script>
</body>
</html>
